name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test
      - uses: actions/configure-pages@v6
      - name: prepare site
        run: |
          mkdir -p "$RUNNER_TEMP/viz-mosaic-site"
          cp -R demo src README.md index.html "$RUNNER_TEMP/viz-mosaic-site/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/viz-mosaic-site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy site
        id: deployment
        uses: actions/deploy-pages@v5
